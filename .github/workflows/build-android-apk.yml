name: Build & Release Android APK (记忆手账)

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES=$(node -p "require('./package.json').releaseNotes || ''")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          EOF_MARKER="EOF_$(date +%s)"
          echo "notes<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Static Bundle & Sync Capacitor Android
        env:
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: npm run build:app

      - name: Compile Signed Android Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../记忆手账.apk
          cp app/build/outputs/apk/release/app-release.apk "../vibe-memory-v${{ steps.pkg.outputs.version }}.apk"

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-memory-v${{ steps.pkg.outputs.version }}-apk
          path: |
            记忆手账.apk
            vibe-memory-v${{ steps.pkg.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release for In-App Auto Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: 记忆手账 v${{ steps.pkg.outputs.version }}
          body: |
            ${{ steps.pkg.outputs.notes }}

            ---
            📱 **覆盖更新说明**：
            - 已安装旧版的用户可直接在 App 内弹窗点击 **「立即下载并覆盖更新」**；
            - 或下载下方 `vibe-memory-v${{ steps.pkg.outputs.version }}.apk` 直接覆盖安装，手机内已有便签、图片与 AI 配置 100% 保留。
          draft: false
          prerelease: false
          files: |
            vibe-memory-v${{ steps.pkg.outputs.version }}.apk
            public/version.json
